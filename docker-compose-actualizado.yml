services:

  namenode:
    build:
      context: ./hadoop/namenode
    container_name: namenode
    hostname: namenode
    volumes:
      - hdfs_namenode:/data/name
    environment:
      - CLUSTER_NAME=pet-cluster
    ports:
      - "9870:9870"
      - "8020:8020"
    networks:
      net_pet:
        ipv4_address: 172.27.1.5


  datanode:
    build:
      context: ./hadoop/datanode
    container_name: datanode
    hostname: datanode
    depends_on:
      - namenode
    volumes:
      - hdfs_datanode:/data/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    ports:
      - "9864:9864"
    networks:
      net_pet:
        ipv4_address: 172.27.1.6


  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      net_pet:
        ipv4_address: 172.27.1.10


  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 3 --memory 3G spark://spark-master:7077
    ports:
      - "8081:8081"
    networks:
      net_pet:
        ipv4_address: 172.27.1.11


  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 3G spark://spark-master:7077
    ports:
      - "8082:8081"
    networks:
      net_pet:
        ipv4_address: 172.27.1.13

  jupyter:
    build:
      context: ./jupyter
    container_name: jupyter
    hostname: jupyter
    depends_on:
      - spark-master
    ports:
      - "8200:8888"
      - "4040-4050:4040-4050"
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
    networks:
      net_pet:
        ipv4_address: 172.27.1.12


  mysql:
    build:
      context: ./mysql/
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: retail_db
    ports:
      - "3310:3306"
    volumes:
      - ./mysqldata:/mysql/data
    env_file:
      - ./mysql/variables.env
    networks:
      net_pet:
        ipv4_address: 172.27.1.15


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      net_pet:
        ipv4_address: 172.27.1.50

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    ports:
      - "9092:9092"

    networks:
      net_pet:
        ipv4_address: 172.27.1.51

volumes:
  hdfs_namenode:
  hdfs_datanode:
  mysql_data:


networks:
  net_pet:
    ipam:
      driver: default
      config:
        - subnet: 172.27.0.0/16
